#
# P4.0 spike workflow — Python flavor (top-level name: + actions:, no trigger block).
# Same flow as workflow.gate-hitl.csharp.yaml. Try whichever flavor your execution surface accepts (Unknown C).
#
# Replace <GATE_URL> with the public URL of gate-endpoint/server.mjs.
# Register prompt agents "DesignerAgent" and "ImplementerAgent" in the Foundry project first.
#
name: sdlc-gate-hitl-spike
description: P4.0 spike — design agent, TS HTTP gate with halt-on-fail, HITL approval, implement agent.

inputs:
  task:
    type: string
    description: The SDLC task description seeding the first agent.

actions:
  # 1) First SDLC agent (design step).
  - kind: InvokeAzureAgent
    id: invoke_designer
    displayName: Run Designer agent
    agent:
      name: DesignerAgent
    conversationId: =System.ConversationId
    input:
      messages: =Workflow.Inputs.task
    output:
      responseObject: Local.DesignerResult
      messages: Local.DesignerMessages
      autoSend: true

  # 2) Governance gate over HTTP -> our TS endpoint.
  - kind: HttpRequestAction
    id: call_gate
    displayName: SDLC eval gate (TS endpoint)
    method: POST
    url: <GATE_URL>
    headers:
      Content-Type: application/json
    body:
      kind: json
      value:
        sdlcStep: design
        output: =Local.DesignerResult
    response: Local.GateResult
    requestTimeoutInMilliseconds: 60000

  # 3) Halt-on-fail.
  - kind: ConditionGroup
    id: enforce_gate
    displayName: Block on gate failure
    conditions:
      - condition: =Not(Local.GateResult.pass)
        id: gate_failed
        actions:
          - kind: SendActivity
            activity:
              text: =Concat("Gate BLOCKED the run: ", Local.GateResult.reason)
          - kind: EndWorkflow
            id: halt_on_gate_fail

  # 4) HITL approval — pause/resume probe.
  - kind: Question
    id: ask_approval
    displayName: Approve proceeding to implementation?
    question:
      text: =Concat("Design passed the gate (", Local.GateResult.reason, "). Approve implementation? (yes/no)")
    variable: Local.Approval
    default: "no"

  - kind: ConditionGroup
    id: enforce_approval
    displayName: Stop if not approved
    conditions:
      - condition: =Local.Approval <> "yes"
        id: not_approved
        actions:
          - kind: SendActivity
            activity:
              text: "Implementation not approved — ending workflow."
          - kind: EndWorkflow
            id: halt_on_reject

  # 5) Second SDLC agent (implement step).
  - kind: InvokeAzureAgent
    id: invoke_implementer
    displayName: Run Implementer agent
    agent:
      name: ImplementerAgent
    conversationId: =System.ConversationId
    input:
      messages: =Local.DesignerMessages
    output:
      responseObject: Local.ImplementerResult
      autoSend: true

  - kind: EndWorkflow
    id: done
    displayName: Workflow complete
